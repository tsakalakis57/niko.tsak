<title>Pick &amp; Place</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.140.2/three.min.js"></script>
<style>
  :root{
    --bg:#f2f0e6;
    --floor:#e6e3d6;
    --surface:#fffdf8;
    --surface-2:#eae7db;
    --ink:#201d17;
    --ink-dim:#6b6659;
    --line:#d9d5c6;
    --accent:#e8650f;
    --accent-ink:#1a1006;
    --accent-2:#2f7a6b;
    --danger:#c3402f;
    --red:#c94a3a;
    --teal:#2f9b8a;
    --violet:#7a63c9;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121317; --floor:#191b20; --surface:#1b1e24; --surface-2:#23262d;
      --ink:#ece9e1; --ink-dim:#9b978c; --line:#33363d;
      --accent:#ff8a3d; --accent-ink:#1a1006; --accent-2:#4fb8a0; --danger:#ff6b60;
      --red:#e5695a; --teal:#48b8a3; --violet:#a08ef0;
    }
  }
  :root[data-theme="dark"]{
    --bg:#121317; --floor:#191b20; --surface:#1b1e24; --surface-2:#23262d;
    --ink:#ece9e1; --ink-dim:#9b978c; --line:#33363d;
    --accent:#ff8a3d; --accent-ink:#1a1006; --accent-2:#4fb8a0; --danger:#ff6b60;
    --red:#e5695a; --teal:#48b8a3; --violet:#a08ef0;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink); }
  body{
    font-family:'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
    -webkit-text-size-adjust:100%;
  }

  .app{ max-width:1180px; margin:0 auto; padding:1.4rem clamp(1rem,3vw,2rem) 3rem; }

  .topbar{ display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:.4rem 1.4rem; margin-bottom:1.2rem; }
  .brand{ display:flex; align-items:baseline; gap:.7rem; flex-wrap:wrap; }
  .eyebrow{ font-size:.68rem; letter-spacing:.24em; text-transform:uppercase; color:var(--ink-dim); }
  h1{ margin:0; font-family:'Big Shoulders Display', system-ui, sans-serif; font-weight:700;
      font-size:clamp(1.9rem, 4vw, 2.7rem); letter-spacing:.01em; text-transform:uppercase; text-wrap:balance; }
  .tagline{ margin:0; font-size:.78rem; color:var(--ink-dim); max-width:30em; }

  .panels{ display:grid; grid-template-columns:minmax(300px,1fr) minmax(340px,1.1fr); gap:1.1rem; align-items:start; }
  @media (max-width:860px){ .panels{ grid-template-columns:1fr; } }

  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:1rem; }
  .panel h2{ margin:0 0 .7rem; font-size:.72rem; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-dim); font-weight:500; }

  .toolbar{ display:flex; flex-wrap:wrap; align-items:center; gap:.5rem; margin-bottom:.7rem; }
  .btn{ font:inherit; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; font-weight:500;
        padding:.6em 1.05em; border-radius:6px; border:1px solid var(--line); background:var(--surface-2);
        color:var(--ink); cursor:pointer; }
  .btn:hover{ border-color:var(--accent); }
  .btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }
  .btn.primary[data-running="true"]{ background:var(--danger); border-color:var(--danger); }

  .speed{ display:flex; align-items:center; gap:.5em; font-size:.68rem; letter-spacing:.06em;
          text-transform:uppercase; color:var(--ink-dim); margin-left:auto; }
  .speed input{ accent-color:var(--accent); width:104px; }
  .speed b{ color:var(--ink); font-variant-numeric:tabular-nums; font-weight:500; }

  .palette{ display:flex; flex-wrap:wrap; gap:.4rem; margin-bottom:.7rem; }
  .chip{ font:inherit; font-size:.68rem; padding:.42em .7em; border-radius:5px; border:1px dashed var(--line);
         background:transparent; color:var(--ink-dim); cursor:pointer; }
  .chip:hover{ color:var(--accent); border-color:var(--accent); }
  .chip:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .editor-wrap{ display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--surface); }
  .gutter{ padding:.75em .55em; text-align:right; color:var(--ink-dim); background:var(--surface-2);
           font:.82rem/1.6 'JetBrains Mono', monospace; white-space:pre; overflow:hidden; user-select:none; }
  textarea#code{ flex:1; border:none; outline:none; resize:vertical; min-height:300px;
                 padding:.75em .9em; font:.82rem/1.6 'JetBrains Mono', monospace; color:var(--ink);
                 background:transparent; tab-size:2; }

  .status{ margin-top:.7rem; font-size:.74rem; color:var(--ink-dim); }
  .status b{ color:var(--accent); font-weight:500; }

  canvas{ display:block; width:100%; aspect-ratio:4/3; border-radius:10px; border:1px solid var(--line); background:var(--floor); touch-action:none; cursor:grab; }
  canvas:active{ cursor:grabbing; }

  .viewhint{ margin-top:.5rem; font-size:.68rem; letter-spacing:.03em; color:var(--ink-dim); }

  .readout{ margin-top:.65rem; font-size:.76rem; color:var(--ink-dim); display:flex; gap:1.3em; flex-wrap:wrap;
            font-variant-numeric:tabular-nums; }
  .readout b{ color:var(--ink); font-weight:500; }

  .log{ margin-top:.65rem; height:128px; overflow-y:auto; background:var(--surface-2); border:1px solid var(--line);
        border-radius:8px; padding:.6rem .75rem; font-size:.72rem; line-height:1.55; }
  .log-line{ color:var(--ink-dim); }
  .log-error{ color:var(--danger); }

  .legend{ margin-top:.7rem; display:flex; gap:1rem; flex-wrap:wrap; font-size:.68rem; color:var(--ink-dim); }
  .legend span{ display:inline-flex; align-items:center; gap:.4em; }
  .swatch{ width:.7em; height:.7em; border-radius:2px; display:inline-block; }
</style>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="eyebrow">robot programming</span>
      <h1>Pick &amp; Place</h1>
    </div>
    <p class="tagline">A small arm you program line by line — shoulder, elbow, gripper, repeat.</p>
  </header>

  <div class="panels">

    <section class="panel">
      <h2>Program</h2>
      <div class="toolbar">
        <button class="btn primary" id="runBtn" type="button" data-running="false">Run</button>
        <button class="btn" id="stepBtn" type="button">Step</button>
        <button class="btn" id="resetBtn" type="button">Reset</button>
        <div class="speed">
          <label for="speed">Speed</label>
          <input type="range" id="speed" min="0.5" max="3" step="0.25" value="1">
          <b id="speedVal">1.0×</b>
        </div>
      </div>

      <div class="palette" id="palette">
        <button class="chip" data-snippet="shoulder(0)" type="button">shoulder( )</button>
        <button class="chip" data-snippet="elbow(0)" type="button">elbow( )</button>
        <button class="chip" data-snippet="gripper(open)" type="button">gripper(open)</button>
        <button class="chip" data-snippet="gripper(close)" type="button">gripper(close)</button>
        <button class="chip" data-snippet="wait(500)" type="button">wait( )</button>
        <button class="chip" data-snippet="repeat(2) {&#10;&#10;}" type="button">repeat( ) { }</button>
      </div>

      <div class="editor-wrap">
        <div class="gutter" id="gutter">1</div>
        <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
      </div>

      <p class="status">Now running — <b id="currentLine">nothing yet. Press Run.</b></p>
    </section>

    <section class="panel">
      <h2>Workshop</h2>
      <canvas id="scene" aria-label="Robot arm simulator"></canvas>
      <p class="viewhint">Drag to orbit · pinch or scroll to zoom</p>
      <div class="readout">
        <span>Shoulder <b id="roShoulder">0°</b></span>
        <span>Elbow <b id="roElbow">60°</b></span>
        <span>Gripper <b id="roGripper">Open</b></span>
      </div>
      <div class="legend">
        <span><i class="swatch" style="background:var(--red)"></i>red</span>
        <span><i class="swatch" style="background:var(--teal)"></i>teal</span>
        <span><i class="swatch" style="background:var(--violet)"></i>violet</span>
      </div>
      <div class="log" id="log"></div>
    </section>

  </div>
</div>

<script>
(function(){
  "use strict";

  // ---------- kinematics ----------
  var L1 = 1.3, L2 = 1.15, REACH = L1 + L2;
  var D2R = Math.PI / 180;

  function dir(a){ var r = a * D2R; return { x: Math.sin(r), y: -Math.cos(r) }; }
  function fk(t1, t2){
    var j = { x: dir(t1).x * L1, y: dir(t1).y * L1 };
    var d2 = dir(t1 + t2);
    return { joint: j, tip: { x: j.x + d2.x * L2, y: j.y + d2.y * L2 } };
  }
  function dist(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }

  var BLOCK_DEFS = [
    { color: 'red',    home: { t1: -55, t2: 70 } },
    { color: 'teal',   home: { t1: -10, t2: 95 } },
    { color: 'violet', home: { t1:  40, t2: 60 } }
  ];
  var PAD_DEFS = [
    { color: 'red',    home: { t1: -70, t2: 25 } },
    { color: 'teal',   home: { t1:  15, t2: 30 } },
    { color: 'violet', home: { t1:  65, t2: 20 } }
  ];
  var blocks = BLOCK_DEFS.map(function(d){
    var p = fk(d.home.t1, d.home.t2).tip;
    return { color: d.color, home: { x: p.x, y: p.y }, pos: { x: p.x, y: p.y }, held: false };
  });
  var pads = PAD_DEFS.map(function(d){
    var p = fk(d.home.t1, d.home.t2).tip;
    return { color: d.color, x: p.x, y: p.y, solved: false };
  });

  var GRAB_TOL = 0.26, PAD_TOL = 0.28;
  var state = { shoulder: 0, elbow: 60, gripperOpen: 1, heldBlock: null };

  // ---------- language ----------
  var EXAMPLE =
"// Welcome back to programming a robot arm.\n" +
"// Commands:  shoulder(deg)   elbow(deg)   gripper(open|close)   wait(ms)\n" +
"// Loops:     repeat(n) { ... }\n" +
"// Ranges:    shoulder -100..100    elbow -150..150\n" +
"\n" +
"// Move the red block onto the red pad\n" +
"shoulder(-55)\n" +
"elbow(70)\n" +
"gripper(close)\n" +
"wait(150)\n" +
"shoulder(-70)\n" +
"elbow(25)\n" +
"gripper(open)\n" +
"\n" +
"// Your turn: a teal block and a violet block are still waiting.\n";

  function compileErr(line, msg){ var e = new Error(msg); e.line = line; return e; }
  function stripComment(line){ var i = line.indexOf('//'); return i >= 0 ? line.slice(0, i) : line; }

  function parseProgram(text){
    var lines = text.split('\n')
      .map(function(raw, i){ return { num: i + 1, code: stripComment(raw).trim() }; })
      .filter(function(l){ return l.code.length > 0; });
    var pos = 0;

    function parseBlock(stopAtBrace){
      var nodes = [];
      while (pos < lines.length){
        var line = lines[pos];
        if (line.code === '}'){
          if (stopAtBrace){ pos++; return nodes; }
          throw compileErr(line.num, "Unexpected '}'.");
        }
        var repeatMatch = line.code.match(/^repeat\s*\(\s*(\d+)\s*\)\s*\{$/i);
        if (repeatMatch){
          var count = parseInt(repeatMatch[1], 10);
          if (count < 1 || count > 50) throw compileErr(line.num, 'repeat(...) must be between 1 and 50.');
          pos++;
          var body = parseBlock(true);
          nodes.push({ type: 'repeat', count: count, body: body, line: line.num });
          continue;
        }
        var callMatch = line.code.match(/^([a-zA-Z]+)\s*\(\s*([^()]*)\s*\)$/);
        if (!callMatch) throw compileErr(line.num, 'Can\'t understand "' + line.code + '".');
        nodes.push({ type: 'call', name: callMatch[1].toLowerCase(), arg: callMatch[2].trim(), line: line.num });
        pos++;
      }
      if (stopAtBrace) throw compileErr(lines.length ? lines[lines.length - 1].num : 1, "Missing closing '}' for repeat.");
      return nodes;
    }

    var ast = parseBlock(false);
    validateCalls(ast);
    var steps = countSteps(ast);
    if (steps > 4000) throw compileErr(1, 'Program has ' + steps + ' steps — over the 4000 limit. Use smaller repeat counts.');
    return ast;
  }

  function validateCalls(nodes){
    for (var i = 0; i < nodes.length; i++){
      var n = nodes[i];
      if (n.type === 'repeat'){ validateCalls(n.body); continue; }
      var name = n.name, arg = n.arg, line = n.line;
      if (name === 'shoulder' || name === 'elbow'){
        var v = Number(arg);
        if (!isFinite(v) || arg === '') throw compileErr(line, name + '(...) needs a number, e.g. ' + name + '(45)');
        var range = name === 'shoulder' ? [-100, 100] : [-150, 150];
        if (v < range[0] || v > range[1]) throw compileErr(line, name + ' angle must be between ' + range[0] + ' and ' + range[1] + '°.');
        n.value = v;
      } else if (name === 'gripper'){
        var a = arg.replace(/["']/g, '').trim().toLowerCase();
        if (a !== 'open' && a !== 'close') throw compileErr(line, 'gripper(...) must be open or close.');
        n.value = a;
      } else if (name === 'wait'){
        var w = Number(arg);
        if (!isFinite(w) || arg === '') throw compileErr(line, 'wait(...) needs a number of milliseconds.');
        if (w < 0 || w > 3000) throw compileErr(line, 'wait must be between 0 and 3000 ms.');
        n.value = w;
      } else {
        throw compileErr(line, 'Unknown command "' + name + '". Try shoulder, elbow, gripper, wait, or repeat.');
      }
    }
  }

  function countSteps(nodes){
    var c = 0;
    for (var i = 0; i < nodes.length; i++){
      var n = nodes[i];
      c += n.type === 'call' ? 1 : n.count * countSteps(n.body);
    }
    return c;
  }

  function* execAst(nodes){
    for (var i = 0; i < nodes.length; i++){
      var n = nodes[i];
      if (n.type === 'call'){ yield n; }
      else { for (var k = 0; k < n.count; k++){ yield* execAst(n.body); } }
    }
  }

  // ---------- execution ----------
  var ast = null, gen = null, running = false;
  var animGen = 0;

  function speedMultiplier(){ return parseFloat(speedEl.value); }

  function animateJoint(which, target){
    var myGen = ++animGen;
    return new Promise(function(resolve){
      var start = state[which];
      var delta = target - start;
      var dur = Math.max(120, Math.abs(delta) * 6 / speedMultiplier());
      var t0 = performance.now();
      function step(now){
        if (myGen !== animGen){ resolve(); return; }
        var t = Math.min(1, (now - t0) / dur);
        var eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        state[which] = start + delta * eased;
        if (t < 1){ requestAnimationFrame(step); }
        else { state[which] = target; resolve(); }
      }
      requestAnimationFrame(step);
    });
  }

  function animateGripper(target){
    var myGen = ++animGen;
    return new Promise(function(resolve){
      var start = state.gripperOpen;
      var end = target === 'open' ? 1 : 0;
      var dur = 260 / speedMultiplier();
      var t0 = performance.now();
      function step(now){
        if (myGen !== animGen){ resolve(); return; }
        var t = Math.min(1, (now - t0) / dur);
        state.gripperOpen = start + (end - start) * t;
        if (t < 1){ requestAnimationFrame(step); }
        else { state.gripperOpen = end; onGripperSettled(target); resolve(); }
      }
      requestAnimationFrame(step);
    });
  }

  function onGripperSettled(target){
    var tip = fk(state.shoulder, state.elbow).tip;
    if (target === 'close'){
      if (state.heldBlock){ log('Already holding a block.'); return; }
      var nearest = null, nd = Infinity;
      for (var i = 0; i < blocks.length; i++){
        var b = blocks[i];
        if (b.held) continue;
        var d = dist(tip, b.pos);
        if (d < GRAB_TOL && d < nd){ nd = d; nearest = b; }
      }
      if (nearest){
        nearest.held = true; state.heldBlock = nearest;
        attachHeldBlock(nearest);
        log('Gripper closed — holding the ' + nearest.color + ' block.');
      }
      else { log('Gripper closed on empty air.'); }
    } else {
      if (state.heldBlock){
        var held = state.heldBlock;
        held.held = false;
        held.pos = { x: tip.x, y: tip.y };
        state.heldBlock = null;
        releaseHeldBlock(held);
        var pad = null;
        for (var j = 0; j < pads.length; j++){
          var p = pads[j];
          if (!p.solved && p.color === held.color && dist(tip, { x: p.x, y: p.y }) < PAD_TOL){ pad = p; break; }
        }
        if (pad){ markPadSolved(pad); log('The ' + held.color + ' block landed on its pad. Nice.'); }
        else { log('Gripper opened — ' + held.color + ' block placed on the table.'); }
      } else {
        log('Gripper opened.');
      }
    }
  }

  function waitMs(ms){ return new Promise(function(res){ setTimeout(res, ms / speedMultiplier()); }); }

  function performCommand(node){
    if (node.name === 'shoulder') return animateJoint('shoulder', node.value);
    if (node.name === 'elbow') return animateJoint('elbow', node.value);
    if (node.name === 'gripper') return animateGripper(node.value);
    if (node.name === 'wait') return waitMs(node.value);
  }

  function reconstruct(node){ return node.name + '(' + node.value + ')'; }
  function highlightStep(node){ currentLineEl.textContent = 'line ' + node.line + ' — ' + reconstruct(node); }

  function compileProgram(){
    try {
      var parsed = parseProgram(codeEl.value);
      ast = parsed;
      log('Compiled ' + countSteps(ast) + ' step(s).');
      return true;
    } catch (e){
      ast = null;
      log('Line ' + e.line + ': ' + e.message, 'error');
      return false;
    }
  }

  function setRunUI(isRunning){
    running = isRunning;
    runBtn.textContent = isRunning ? 'Pause' : 'Run';
    runBtn.setAttribute('data-running', isRunning ? 'true' : 'false');
    stepBtn.disabled = isRunning;
  }

  async function runProgram(){
    if (!ast && !compileProgram()) return;
    if (!gen) gen = execAst(ast);
    setRunUI(true);
    while (running){
      var res = gen.next();
      if (res.done){ log('Program finished.'); gen = null; setRunUI(false); break; }
      highlightStep(res.value);
      await performCommand(res.value);
    }
  }

  async function stepProgram(){
    if (running) return;
    if (!ast && !compileProgram()) return;
    if (!gen) gen = execAst(ast);
    var res = gen.next();
    if (res.done){ log('Program finished.'); gen = null; return; }
    highlightStep(res.value);
    await performCommand(res.value);
  }

  function resetSim(){
    setRunUI(false);
    gen = null;
    animGen++;
    state.shoulder = 0; state.elbow = 60; state.gripperOpen = 1; state.heldBlock = null;
    blocks.forEach(function(b){ b.pos = { x: b.home.x, y: b.home.y }; b.held = false; resetBlockMesh(b); });
    pads.forEach(function(p){ p.solved = false; resetPadMesh(p); });
    currentLineEl.textContent = 'nothing yet. Press Run.';
    clearLog();
    log('Arm reset to home position.');
  }

  // ---------- log ----------
  var logEl = document.getElementById('log');
  function log(msg, type){
    var line = document.createElement('div');
    line.className = 'log-line' + (type === 'error' ? ' log-error' : '');
    line.textContent = msg;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }
  function clearLog(){ logEl.innerHTML = ''; }

  // ---------- editor ----------
  var codeEl = document.getElementById('code');
  var gutterEl = document.getElementById('gutter');
  codeEl.value = EXAMPLE;

  function updateGutter(){
    var n = codeEl.value.split('\n').length;
    var s = '';
    for (var i = 1; i <= n; i++) s += i + '\n';
    gutterEl.textContent = s;
  }
  codeEl.addEventListener('input', function(){ updateGutter(); ast = null; gen = null; });
  codeEl.addEventListener('scroll', function(){ gutterEl.scrollTop = codeEl.scrollTop; });
  codeEl.addEventListener('keydown', function(e){
    if (e.key === 'Tab'){
      e.preventDefault();
      var start = codeEl.selectionStart, end = codeEl.selectionEnd;
      codeEl.value = codeEl.value.slice(0, start) + '  ' + codeEl.value.slice(end);
      codeEl.setSelectionRange(start + 2, start + 2);
      updateGutter(); ast = null; gen = null;
    } else if ((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
      e.preventDefault();
      runBtn.click();
    }
  });
  updateGutter();

  function insertAtCursor(text){
    var start = codeEl.selectionStart, end = codeEl.selectionEnd;
    var before = codeEl.value.slice(0, start), after = codeEl.value.slice(end);
    var prefix = (before.length > 0 && !before.endsWith('\n')) ? '\n' : '';
    var insert = prefix + text + '\n';
    codeEl.value = before + insert + after;
    var pos = (before + insert).length;
    codeEl.focus();
    codeEl.setSelectionRange(pos, pos);
    updateGutter(); ast = null; gen = null;
  }
  document.getElementById('palette').addEventListener('click', function(e){
    var btn = e.target.closest('.chip');
    if (!btn) return;
    insertAtCursor(btn.getAttribute('data-snippet'));
  });

  // ---------- controls ----------
  var runBtn = document.getElementById('runBtn');
  var stepBtn = document.getElementById('stepBtn');
  var resetBtn = document.getElementById('resetBtn');
  var speedEl = document.getElementById('speed');
  var speedVal = document.getElementById('speedVal');
  var currentLineEl = document.getElementById('currentLine');

  runBtn.addEventListener('click', function(){
    if (running){ setRunUI(false); } else { runProgram(); }
  });
  stepBtn.addEventListener('click', function(){ stepProgram(); });
  resetBtn.addEventListener('click', function(){ resetSim(); });
  speedEl.addEventListener('input', function(){ speedVal.textContent = parseFloat(speedEl.value).toFixed(2).replace(/0$/, '') + '×'; });

  // ---------- rendering (3D) ----------
  var canvas = document.getElementById('scene');

  var rootStyle = getComputedStyle(document.documentElement);
  function cssVar(name){ return rootStyle.getPropertyValue(name).trim(); }
  var COLORS = {
    ink: cssVar('--ink'), line: cssVar('--line'), bg: cssVar('--bg'),
    surface: cssVar('--surface'), surface2: cssVar('--surface-2'), floor: cssVar('--floor'),
    accent: cssVar('--accent'), accent2: cssVar('--accent-2'),
    red: cssVar('--red'), teal: cssVar('--teal'), violet: cssVar('--violet')
  };

  var SCALE = 1.6;                 // world units per kinematic unit
  var COLUMN_H = 1.0, PLATE_H = 0.12;
  var SHOULDER_Y = COLUMN_H + PLATE_H;
  var L1W = L1 * SCALE, L2W = L2 * SCALE;
  var BLOCK_H = 0.16;
  var WRIST_DROP = SHOULDER_Y - BLOCK_H / 2; // aligns jaw/held-block height with a resting block's center

  function toWorldXZ(u){ return { x: u.x * SCALE, z: -u.y * SCALE }; }

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(COLORS.bg);
  scene.fog = new THREE.Fog(new THREE.Color(COLORS.bg).getHex(), 7, 15);

  var camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);

  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  if ('outputEncoding' in renderer) renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;

  // lights
  scene.add(new THREE.HemisphereLight(0xffffff, 0x33322c, 0.65));
  var keyLight = new THREE.DirectionalLight(0xfff3e6, 1.15);
  keyLight.position.set(4.5, 6.5, 3.5);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(1024, 1024);
  keyLight.shadow.camera.left = -6; keyLight.shadow.camera.right = 6;
  keyLight.shadow.camera.top = 6; keyLight.shadow.camera.bottom = -6;
  keyLight.shadow.camera.near = 0.5; keyLight.shadow.camera.far = 18;
  keyLight.shadow.bias = -0.0015;
  scene.add(keyLight);
  var fillLight = new THREE.DirectionalLight(0xdfeaff, 0.35);
  fillLight.position.set(-5, 3.5, -3);
  scene.add(fillLight);

  // floor + table
  var floor = new THREE.Mesh(
    new THREE.PlaneGeometry(40, 40),
    new THREE.MeshStandardMaterial({ color: COLORS.floor, roughness: 1, metalness: 0 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -0.45;
  floor.receiveShadow = true;
  scene.add(floor);

  var TABLE_SIDE = 9.2, TABLE_THICK = 0.15;
  var table = new THREE.Mesh(
    new THREE.BoxGeometry(TABLE_SIDE, TABLE_THICK, TABLE_SIDE),
    new THREE.MeshStandardMaterial({ color: COLORS.surface2, roughness: 0.85, metalness: 0.05 })
  );
  table.position.y = -TABLE_THICK / 2;
  table.receiveShadow = true;
  scene.add(table);

  var grid = new THREE.GridHelper(8.6, 18, COLORS.line, COLORS.line);
  grid.position.y = 0.004;
  grid.material.transparent = true;
  grid.material.opacity = 0.35;
  scene.add(grid);

  // materials
  var metalMat = new THREE.MeshStandardMaterial({ color: 0x2c2e34, roughness: 0.35, metalness: 0.8 });
  var accentMat = new THREE.MeshStandardMaterial({ color: COLORS.accent, roughness: 0.4, metalness: 0.45 });
  var jawMat = new THREE.MeshStandardMaterial({ color: COLORS.accent2, roughness: 0.3, metalness: 0.55 });

  // arm hierarchy: baseGroup -> shoulderGroup(rot.y=shoulder) -> link1 + elbowGroup(rot.y=elbow) -> link2 + gripperGroup
  var baseGroup = new THREE.Group();
  scene.add(baseGroup);

  var basePlate = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.48, PLATE_H, 32), metalMat);
  basePlate.position.y = PLATE_H / 2;
  basePlate.castShadow = true; basePlate.receiveShadow = true;
  baseGroup.add(basePlate);

  var column = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.2, COLUMN_H, 24), metalMat);
  column.position.y = PLATE_H + COLUMN_H / 2;
  column.castShadow = true;
  baseGroup.add(column);

  var shoulderGroup = new THREE.Group();
  shoulderGroup.position.set(0, SHOULDER_Y, 0);
  baseGroup.add(shoulderGroup);

  var shoulderHub = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.22, 24), metalMat);
  shoulderHub.castShadow = true;
  shoulderGroup.add(shoulderHub);

  var link1 = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.16, L1W), accentMat);
  link1.position.set(0, 0, L1W / 2);
  link1.castShadow = true; link1.receiveShadow = true;
  shoulderGroup.add(link1);

  var elbowGroup = new THREE.Group();
  elbowGroup.position.set(0, 0, L1W);
  shoulderGroup.add(elbowGroup);

  var elbowHub = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.2, 24), metalMat);
  elbowHub.castShadow = true;
  elbowGroup.add(elbowHub);

  var link2 = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.13, L2W), accentMat);
  link2.position.set(0, 0, L2W / 2);
  link2.castShadow = true; link2.receiveShadow = true;
  elbowGroup.add(link2);

  var gripperGroup = new THREE.Group();
  gripperGroup.position.set(0, 0, L2W);
  elbowGroup.add(gripperGroup);

  var wrist = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, WRIST_DROP, 16), metalMat);
  wrist.position.set(0, -WRIST_DROP / 2, 0);
  wrist.castShadow = true;
  gripperGroup.add(wrist);

  var jawGeo = new THREE.BoxGeometry(0.045, 0.05, 0.26);
  var jawL = new THREE.Mesh(jawGeo, jawMat);
  var jawR = new THREE.Mesh(jawGeo, jawMat);
  jawL.castShadow = true; jawR.castShadow = true;
  gripperGroup.add(jawL, jawR);

  function updateJaws(){
    var spread = 0.03 + 0.11 * state.gripperOpen;
    jawL.position.set(-spread, -WRIST_DROP, 0.09);
    jawR.position.set(spread, -WRIST_DROP, 0.09);
  }

  // blocks + pads: attach a mesh to each existing logical object
  var blockGeo = new THREE.BoxGeometry(0.24, BLOCK_H, 0.24);
  blocks.forEach(function(b){
    var mat = new THREE.MeshStandardMaterial({ color: COLORS[b.color], roughness: 0.5, metalness: 0.06 });
    var mesh = new THREE.Mesh(blockGeo, mat);
    mesh.castShadow = true; mesh.receiveShadow = true;
    scene.add(mesh);
    b.mesh = mesh;
    resetBlockMesh(b);
  });

  var padGeo = new THREE.RingGeometry(0.15, 0.22, 40);
  pads.forEach(function(p){
    var mat = new THREE.MeshStandardMaterial({
      color: COLORS[p.color], roughness: 0.6, metalness: 0.1,
      transparent: true, opacity: 0.35, side: THREE.DoubleSide,
      emissive: new THREE.Color(COLORS[p.color]), emissiveIntensity: 0
    });
    var mesh = new THREE.Mesh(padGeo, mat);
    mesh.rotation.x = -Math.PI / 2;
    mesh.receiveShadow = true;
    var w = toWorldXZ({ x: p.x, y: p.y });
    mesh.position.set(w.x, 0.006, w.z);
    scene.add(mesh);
    p.mesh = mesh;
  });

  function resetBlockMesh(b){
    if (b.mesh.parent !== scene) scene.add(b.mesh);
    var w = toWorldXZ(b.pos);
    b.mesh.position.set(w.x, BLOCK_H / 2, w.z);
    b.mesh.rotation.set(0, 0, 0);
  }
  function resetPadMesh(p){
    p.mesh.material.opacity = 0.35;
    p.mesh.material.emissiveIntensity = 0;
  }
  function attachHeldBlock(b){
    gripperGroup.add(b.mesh);
    b.mesh.position.set(0, -WRIST_DROP, 0.09);
    b.mesh.rotation.set(0, 0, 0);
  }
  function releaseHeldBlock(b){
    var world = new THREE.Vector3();
    b.mesh.getWorldPosition(world);
    scene.add(b.mesh);
    b.mesh.position.set(world.x, BLOCK_H / 2, world.z);
  }
  function markPadSolved(p){
    p.solved = true;
    p.mesh.material.opacity = 0.78;
    p.mesh.material.emissiveIntensity = 0.55;
  }

  // ---------- orbit camera (touch-first: 1-finger orbit, pinch/wheel zoom) ----------
  var orbit = { az: 0.65, pol: 1.0, dist: 7, target: new THREE.Vector3(0, 0.55, 0) };
  function clampPolar(p){ return Math.min(Math.max(p, 0.28), 1.45); }
  function updateCameraFromOrbit(){
    var p = orbit.pol, a = orbit.az, d = orbit.dist;
    camera.position.set(
      orbit.target.x + d * Math.sin(p) * Math.sin(a),
      orbit.target.y + d * Math.cos(p),
      orbit.target.z + d * Math.sin(p) * Math.cos(a)
    );
    camera.lookAt(orbit.target);
  }

  var pointers = new Map();
  var lastPinchDist = null;
  canvas.addEventListener('pointerdown', function(e){
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { canvas.setPointerCapture(e.pointerId); } catch (err){}
  });
  canvas.addEventListener('pointermove', function(e){
    if (!pointers.has(e.pointerId)) return;
    var prev = pointers.get(e.pointerId);
    var cur = { x: e.clientX, y: e.clientY };
    pointers.set(e.pointerId, cur);
    if (pointers.size === 1){
      var dx = cur.x - prev.x, dy = cur.y - prev.y;
      orbit.az -= dx * 0.0065;
      orbit.pol = clampPolar(orbit.pol - dy * 0.0065);
      updateCameraFromOrbit();
    } else if (pointers.size === 2){
      var pts = Array.from(pointers.values());
      var d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      if (lastPinchDist != null){
        orbit.dist = Math.min(Math.max(orbit.dist - (d - lastPinchDist) * 0.018, 3), 13);
        updateCameraFromOrbit();
      }
      lastPinchDist = d;
    }
  });
  function endPointer(e){ pointers.delete(e.pointerId); lastPinchDist = null; }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerleave', endPointer);
  canvas.addEventListener('wheel', function(e){
    e.preventDefault();
    orbit.dist = Math.min(Math.max(orbit.dist + e.deltaY * 0.012, 3), 13);
    updateCameraFromOrbit();
  }, { passive: false });

  function fitRenderer(){
    var rect = canvas.getBoundingClientRect();
    var w = rect.width, h = rect.height;
    if (w < 1 || h < 1) return;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(fitRenderer).observe(canvas);
  window.addEventListener('orientationchange', fitRenderer);

  var roShoulder = document.getElementById('roShoulder');
  var roElbow = document.getElementById('roElbow');
  var roGripper = document.getElementById('roGripper');
  function updateReadout(){
    roShoulder.textContent = Math.round(state.shoulder) + '°';
    roElbow.textContent = Math.round(state.elbow) + '°';
    roGripper.textContent = state.gripperOpen > 0.5 ? 'Open' : 'Closed';
  }

  function animate(){
    requestAnimationFrame(animate);
    shoulderGroup.rotation.y = state.shoulder * D2R;
    elbowGroup.rotation.y = state.elbow * D2R;
    updateJaws();
    updateReadout();
    renderer.render(scene, camera);
  }

  fitRenderer();
  updateCameraFromOrbit();
  requestAnimationFrame(animate);
  resetSim();
  log('Program loaded. Press Run to move the arm.');
})();
</script>
